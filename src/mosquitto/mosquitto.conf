# Mosquitto 2.x configuration for NServiceBus.Community.Mqtt.
#
# The test projects mount this file into the eclipse-mosquitto:2 container they start. It is also the
# configuration to use when you run a broker by hand and select it with the MqttTransport_Server and
# MqttTransport_Port environment variables (see the README).

# Mosquitto 2.x only accepts local connections when no listener is configured. The container is reached
# from outside, so a listener is required.
listener 1883
allow_anonymous true

# The transport maps every queue to a persistent session. Sessions (with their subscriptions and queued
# messages) must be kept across client disconnects.
persistence true
persistence_location /mosquitto/data/

# Offline queue cap per session. Mosquitto's default is 1000, and it drops messages beyond that.
max_queued_messages 100000

# Unacknowledged QoS 1 messages in flight per client. The client's own ReceiveMaximum still applies on top.
max_inflight_messages 1000
